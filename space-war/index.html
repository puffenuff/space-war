<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SPACE WAR</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="game-canvas"></canvas>

<button id="btn-mute" class="mute-btn">🔊</button>

<!-- ===================== START / TITLE SCREEN ===================== -->
<div id="title-screen" class="overlay">
  <h1 class="title-logo">SPACE <span>WAR</span></h1>
  <p class="subtitle">starring Billy Bob, Astronaut</p>
  <button id="btn-new-game" class="big-btn">NEW GAME</button>
  <button id="btn-continue" class="big-btn">CONTINUE</button>
  <p class="hint">WASD / drag joystick to move &middot; drag screen to look &middot; Shift to sprint &middot; F to shoot &middot; R to reload &middot; E to interact</p>
</div>

<!-- ===================== HUD ===================== -->
<div id="hud" class="hidden">
  <div id="hud-top-left">
    <div id="health-bar-wrap"><div id="health-bar"></div><span id="health-label">100</span></div>
    <div id="location-label">BASE</div>
  </div>
  <div id="hud-top-right">
    <div class="hud-pill">🪙 <span id="coin-count">0</span></div>
    <div class="hud-pill">⛏️ <span id="ore-count">0</span></div>
    <div class="hud-pill" id="parts-pill">🔧 <span id="parts-count">0</span>/6</div>
  </div>
  <div id="mission-tracker"></div>
  <div id="boss-health-wrap" class="hidden">
    <div id="boss-name">YETI</div>
    <div id="boss-health-bar-outer"><div id="boss-health-bar"></div></div>
  </div>
  <div id="interact-prompt" class="hidden"></div>
  <div id="pickup-toast" class="hidden"></div>
  <div id="dig-progress-wrap" class="hidden"><div id="dig-progress-bar"></div></div>
  <div id="crosshair" class="hidden">+</div>
  <div id="ammo-display" class="hidden"><span id="ammo-count">8 / 8</span></div>
</div>

<!-- ===================== TOUCH CONTROLS ===================== -->
<div id="touch-controls" class="hidden">
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <div id="action-buttons">
    <button id="btn-sprint" class="ctrl-btn">RUN</button>
    <button id="btn-jump" class="ctrl-btn">JUMP</button>
    <button id="btn-reload" class="ctrl-btn">RELOAD</button>
    <button id="btn-interact" class="ctrl-btn">USE</button>
    <button id="btn-fire" class="ctrl-btn fire">FIRE</button>
  </div>
</div>

<!-- ===================== SHOP / DIALOG PANEL ===================== -->
<div id="panel-backdrop" class="hidden">
  <div id="panel">
    <div id="panel-header">
      <span id="panel-title"></span>
      <button id="panel-close">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<!-- ===================== MISSION LOG / CRAFT ===================== -->
<div id="top-center-btns">
  <button id="btn-missions" class="hidden corner-btn">📋 MISSIONS</button>
  <button id="btn-craft" class="hidden corner-btn">🛠️ CRAFT</button>
</div>

<!-- ===================== STAR MAP ===================== -->
<div id="starmap-hint" class="hidden"></div>

<!-- ===================== BIG MESSAGE (planet complete, etc) ===================== -->
<div id="big-message" class="hidden"></div>

<!-- ===================== LOADING ===================== -->
<div id="loading-screen">
  <div class="loader"></div>
  <p>Loading SPACE WAR...</p>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/noise.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/controls.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/world.js"></script>
<script src="js/base.js"></script>
<script src="js/missions.js"></script>
<script src="js/spaceflight.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
